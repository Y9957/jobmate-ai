server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # PDF upload limit is 5MB in the API

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Single-page app: unknown paths go to index.html, the router handles them
    location / {
        try_files $uri /index.html;
    }
}
